# SonarCloud configuration for the Heretek-AI/GDevelop-Heretek fork.
#
# !!! READ THIS BEFORE ADDING RULE-LEVEL SUPPRESSIONS !!!
#
# This project uses SonarCloud *automatic analysis* (verified: the project
# setting `sonar.autoscan.enabled` is `true`). Under automatic analysis:
#
#   * Only the keys documented for `.sonarcloud.properties` are honoured —
#     `sonar.sources`, `sonar.exclusions`, `sonar.inclusions`, `sonar.tests`,
#     `sonar.test.exclusions`, `sonar.test.inclusions`, `sonar.sourceEncoding`,
#     `sonar.cpd.exclusions`, `sonar.python.version`.
#   * `sonar.issue.ignore.multicriteria` (and its `sonar.issue.enforce.*`
#     sibling) are NOT among them and CANNOT be set from this file. They are
#     a Project Settings -> Issues -> Exclusions (UI) setting only.
#
# A previous revision of this file carried ~200 lines of commented-out
# `sonar.issue.ignore.multicriteria.e1..e88` entries. They were inert and
# were deleted; the same applies to `scripts/sonarcloud-apply-suppressions.sh`,
# which only printed them. Do not re-add either. If rule-level suppression is
# wanted later, that is a UI action or a switch to CI-based analysis.
#
# Path exclusions below ARE honoured — verified against the live issue set:
# a path listed here reports zero open issues while a sibling path outside
# the list reports them (e.g. filter-glitch.js = 0, filter-crt.js = 5).
#
# These mirror the .fallow.toml exclusions.

sonar.exclusions=\
  Extensions/Spine/spine-pixi-v7/**,\
  GDJS/Runtime/libs/**,\
  GDJS/Runtime/pixi-renderers/pixi.js,\
  GDJS/Runtime/pixi-renderers/three.js,\
  GDJS/Runtime/pixi-renderers/ThreeAddons.js,\
  GDJS/Runtime/pixi-renderers/draco/**,\
  GDJS/Runtime/howler-sound-manager/howler.min.js,\
  GDJS/Runtime/fontfaceobserver-font-manager/fontfaceobserver.js,\
  newIDE/app/public/external/**,\
  newIDE/app/src/EditorFunctions/index.js,\
  newIDE/app/src/EditorFunctions/SimplifiedProject/**,\
  newIDE/app/src/stories/**,\
  newIDE/app/resources/GDJS/Runtime-sources/**,\
  **/flow-typed/**,\
  **/flow-libs/**,\
  build/**,\
  dist/**,\
  node_modules/**,\
  Binaries/**,\
  GDJS/tests/games/**,\
  newIDE/app/src/locales/**,\
  SharedLibs/ThreeAddons/**,\
  Extensions/Physics3DBehavior/JsExtension.js,\
  Extensions/Effects/pixi-filters/**,\
  Extensions/Firebase/B_firebasetools/**,\
  Extensions/TileMap/JsExtension.js,\
  Extensions/NavMeshPathfinding/JsExtension.js,\
  GDevelop.js/Bindings/Wrapper.cpp,\
  GDevelop.js/Bindings/postjs.js,\
  GDevelop.js/Bindings/glue.cpp,\
  GDevelop.js/Bindings/glue.js,\
  GDevelop.js/types/**,\
  GDevelop.js/types.d.ts

# Scope of the files analyzed as production source.
#
# `newIDE/app/src` (the editor UI, ~2,350 source files) is deliberately NOT
# listed as a test root and is not excluded either. It is currently absent
# from the SonarCloud index entirely — see MAINTENANCE.md for the measured
# state and the probe command. Do not "fix" that by adding it to
# `sonar.exclusions`: that would hide the fork's own AI/Studio code from
# analysis permanently, which is worse than the current gap.
sonar.sources=\
  newIDE/app/src,\
  newIDE/app/scripts,\
  Extensions,\
  GDJS/Runtime,\
  GDevelop.js,\
  SharedLibs

# Test scope.
#
# This block previously read `sonar.test.inclusions=newIDE/app/src/**,
# Extensions/**/*.{js,ts}, ...` under the comment "Test coverage paths (only
# include JS source we actively maintain)" — i.e. it declared *production*
# source directories as test inclusions. That is a misreading of the key:
# `sonar.test.inclusions` is a glob filter applied *within* `sonar.tests`, and
# `Extensions/**/*.{js,ts}` is not a valid Sonar glob (no brace expansion).
#
# Corrected form: `sonar.tests` names the roots that contain test files, and
# `sonar.test.inclusions` keeps only the actual test files in scope.
sonar.tests=\
  Extensions,\
  GDevelop.js,\
  GDJS/tests,\
  SharedLibs,\
  newIDE/app/scripts

sonar.test.inclusions=\
  **/*.spec.js,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/__tests__/**,\
  **/tests/**

# C++/Python/etc. are handled by separate tooling
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.python.file.suffixes=-
sonar.java.file.suffixes=-

# Coverage exclusions (block the coverage tool from looking at
# generated/transpiled files where coverage is meaningless)
sonar.coverage.exclusions=\
  **/*.spec.js,\
  **/*.spec.ts,\
  **/stories/**,\
  newIDE/app/src/AiGeneration/AiRequestChat/ChatMessages.js
