# SonarCloud configuration for the Heretek-AI/GDevelop-Heretek fork.
#
# Excludes paths we don't maintain (vendored bundles, codemod output,
# generated test fixtures) so they don't pollute the issue count.
# These mirror the .fallow.toml exclusions.

sonar.exclusions=\
  Extensions/Spine/spine-pixi-v7/**,\
  GDJS/Runtime/libs/**,\
  GDJS/Runtime/pixi-renderers/pixi.js,\
  GDJS/Runtime/pixi-renderers/three.js,\
  GDJS/Runtime/pixi-renderers/ThreeAddons.js,\
  GDJS/Runtime/howler-sound-manager/howler.min.js,\
  GDJS/Runtime/fontfaceobserver-font-manager/fontfaceobserver.js,\
  newIDE/app/public/external/**,\
  newIDE/app/src/EditorFunctions/index.js,\
  newIDE/app/src/EditorFunctions/SimplifiedProject/**,\
  newIDE/app/src/stories/**,\
  newIDE/app/resources/GDJS/Runtime-sources/**,\
  **/flow-typed/**,\
  **/flow-libs/**,\
  build/**,\
  dist/**,\
  node_modules/**,\
  Binaries/**,\
  GDJS/tests/games/**,\
  newIDE/app/src/locales/**,\
  SharedLibs/ThreeAddons/**,\
  Extensions/Physics3DBehavior/JsExtension.js,\
  Extensions/Effects/pixi-filters/filter-color-gradient.js,\
  GDevelop.js/Bindings/Wrapper.cpp,\
  GDevelop.js/Bindings/postjs.js

# Test coverage paths (only include JS source we actively maintain)
sonar.test.inclusions=\
  newIDE/app/src/**,\
  Extensions/**/*.{js,ts},\
  GDJS/Runtime/**/*.{js,ts},\
  GDevelop.js/**/*.{js,ts},\
  SharedLibs/**/*.{js,ts}

# Source code paths (exclude vendored + generated)
sonar.sources=\
  newIDE/app/src,\
  newIDE/app/scripts,\
  Extensions,\
  GDJS/Runtime,\
  GDevelop.js,\
  SharedLibs

# C++/Python/etc. are handled by separate tooling
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.python.file.suffixes=-
sonar.java.file.suffixes=-

# Coverage exclusions (block the coverage tool from looking at
# generated/transpiled files where coverage is meaningless)
sonar.coverage.exclusions=\
  **/*.spec.js,\
  **/*.spec.ts,\
  **/stories/**,\
  newIDE/app/src/AiGeneration/AiRequestChat/ChatMessages.js

# =========================================================================
# Phase 3 — Per-rule suppressions (SonarCloud "Issue Exclusions")
# =========================================================================
#
# These are SERVER-SIDE settings on SonarCloud. The block below is
# documentation of what we want; the operator (you) pastes the
# equivalent into Project Settings → Issues → Exclusions → "Multi-
# criteria" → Add. The format is one entry per criterion, with a 4-letter
# code and the ruleKey + (resourceKey | componentKeys | paths) as
# glob/range.
#
# Each criterion maps to the same ignoreFindings entry in
# .fallow.toml. Review and adjust the globs as the codebase evolves.

