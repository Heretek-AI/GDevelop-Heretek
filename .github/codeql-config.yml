# CodeQL configuration for this fork.
#
# !!! THIS FILE IS NOT READ BY THE CURRENT CODE SCANNING SETUP !!!
#
# This repository uses CodeQL *default setup* (verified: the code scanning
# configuration lists languages actions, c-cpp, javascript, python and
# typescript with the `extended` query suite). Default setup does NOT read a
# repository's `.github/codeql-config.yml`; it only honours a config file
# named by the `github-codeql-config-file` *repository property*, which must
# be created at the organisation level and is currently unset (the org
# exposes no custom properties).
#
# Evidence that this file is inert: it lists `**/__tests__/**` under
# `paths-ignore`, yet code scanning reports an open alert inside
# `GDevelop.js/__tests__/ExpressionCompletionFinder.spec.js` and inside
# `GDJS/tests/games/iframe-playground/*.html`.
#
# The `paths` list below is therefore documentation of intent, not enforcement.
# Two ways to make it real, pick one when it matters:
#
#   1. Create the org repository property so default setup picks this file up:
#        gh api --method PATCH orgs/Heretek-AI/properties/schema \
#          -f 'properties[][property_name]=github-codeql-config-file' ...
#      then set it per repository to `.github/codeql-config.yml`. Requires org
#      admin; see GitHub's "Repository properties for code scanning".
#   2. Switch code scanning to advanced setup (a workflow that calls
#      `github/codeql-action/init` with `config-file:`). More moving parts and
#      a workflow to maintain on every sync.
#
# Until then, exclude paths by fixing the alerts or dismissing them with a
# reason in the Security tab, not by editing this file.

name: "GDevelop Heretek JS/TS security-and-quality"
paths:
  - newIDE/app/src
  - newIDE/electron-app
  - newIDE/web-app
  - GDJS
  - GDevelop.js
  - SharedLibs
  - Extensions

paths-ignore:
  - "**/*.test.js"
  - "**/*.spec.js"
  - "**/*.spec.ts"
  - "**/__tests__/**"
  - "**/node_modules/**"
  - "**/build/**"
  - "**/dist/**"
  - "**/.storybook/**"
