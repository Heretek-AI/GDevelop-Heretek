name: Probe - can GITHUB_TOKEN create an ISSUE?

# THROWAWAY DIAGNOSTIC. Delete after reading the run summary.
#
# Follow-up to the PR probe, which proved GITHUB_TOKEN *can* create pull
# requests in this repo (PR #141, author app/github-actions).
#
# The upstream-sync workflow's CONFLICT path does not create a PR - it calls
# `gh issue create`. The previous probe of this repo concluded "org policy
# forces read-only GITHUB_TOKEN" from an issue-creation test, so issue and PR
# permissions may differ. This isolates that.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe:
    name: Probe issue creation
    runs-on: ubuntu-latest
    steps:
      - name: Create then close a probe issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Issue creation probe" >> "$GITHUB_STEP_SUMMARY"
          RESP=$(gh issue create \
            --title "[probe] GITHUB_TOKEN issue creation" \
            --body "Automated probe. Closed immediately." 2>&1) || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP" | head -10 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          NUM=$(echo "$RESP" | grep -oE '[0-9]+$' | head -1)
          if [ -n "$NUM" ]; then
            echo "ISSUE_CREATE=ok (#$NUM)" >> "$GITHUB_STEP_SUMMARY"
            gh issue close "$NUM" --comment "Probe complete; closing." 2>&1 || true
            gh issue delete "$NUM" --yes 2>&1 || true
          else
            echo "ISSUE_CREATE=FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi
