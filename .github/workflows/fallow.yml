# Fallow static analysis gate.
#
# Runs on PRs and reports any new issues introduced by the change as
# annotations. Also runs weekly on master to track drift.
#
# Excludes are configured in .fallow.toml at the repo root.

name: Fallow

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 5 * * 1"  # weekly Monday 05:00 UTC

permissions:
  contents: read
  pull-requests: write  # for inline PR comments
  security-events: write # for Fallow SARIF upload (CodeQL upload-sarif action)

jobs:
  audit:
    name: Fallow audit (changed files)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run fallow audit
        uses: fallow-rs/fallow@bd8fca5af5df4ccfd94c7a835d17bd93c31a7cef # v3
        with:
          version: "3.27.0"
          command: audit
          fail-on-issues: false   # informational only for now; gate after Phase 3 suppressions
          format: github-summary

  full:
    name: Fallow full scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run fallow full scan
        continue-on-error: true
        # Pin the CLI version explicitly. A bare `npx fallow` resolves the
        # `latest` dist-tag at run time, which has been observed to hand back
        # 3.3.0 on one run and 3.27.0 on another — so an unpinned full scan
        # can silently disagree with the `audit` job, which pins 3.27.0 via
        # the action's `version:` input (same npm version scheme).
        #
        # NOTE: `--format` and `--output` are the SAME option (`--output` is a
        # documented alias of `--format`), so passing both fails with
        # "the argument '--format <FORMAT>' cannot be used multiple times" and
        # no SARIF file is ever written. Use `--output-file` for the path.
        run: npx --yes fallow@3.27.0 --format sarif --output-file fallow.sarif 2>&1 | tee fallow.log
      - name: Make the SARIF acceptable to code scanning
        if: always()
        # Two fixes, both required and both verified against real output from
        # the pinned CLI:
        #
        # 1. Unique categories. `upload-sarif` rejects a file whose runs collide
        #    on category:
        #      "The CodeQL Action does not support uploading multiple SARIF runs
        #       with the same category."
        #    fallow emits three runs and two carry no `automationDetails`, so
        #    both fall back to the default. Code scanning keys on each run's
        #    `automationDetails.id`, so stamp one per run.
        #
        # 2. Drop results that carry no `locations`. The `fallow/dupes` run
        #    reports code duplication — 239 results, none with a location — and
        #    code scanning rejects the entire upload:
        #      "locationFromSarifResult: expected at least one location"
        #    Those findings have no file/line to annotate, so they cannot be
        #    represented in code scanning at all. The run is removed instead of
        #    uploaded empty; duplication is still surfaced by the `audit` job's
        #    summary and the archived fallow.log.
        run: |
          node -e '
            const fs = require("fs");
            const file = "fallow.sarif";
            if (!fs.existsSync(file)) { console.log("no SARIF written; nothing to fix"); process.exit(0); }
            const sarif = JSON.parse(fs.readFileSync(file, "utf8"));
            const before = sarif.runs.length;
            let dropped = 0;
            sarif.runs = sarif.runs.filter((run) => {
              const results = run.results || [];
              const usable = results.filter((r) => (r.locations || []).length > 0);
              dropped += results.length - usable.length;
              run.results = usable;
              return usable.length > 0;
            });
            sarif.runs.forEach((run, i) => {
              run.automationDetails = { id: `fallow/run-${i}` };
            });
            fs.writeFileSync(file, JSON.stringify(sarif));
            console.log(`runs: ${before} -> ${sarif.runs.length}; ` +
              `dropped ${dropped} location-less result(s); ` +
              `categories: ${sarif.runs.map((r) => r.automationDetails.id).join(", ") || "(none)"}`);
          '
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: fallow.sarif
          # No `category:` here. It applies to the whole upload, not to runs
          # inside the file, so it does not resolve the intra-file collision —
          # the step above does that per run. Setting it as well is harmless
          # but misleading, so it is intentionally absent.
      - name: Archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fallow-log
          path: fallow.log
          if-no-files-found: ignore
          retention-days: 7

  sonarcloud-drift:
    name: SonarCloud drift check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # `sonarcloud-drift.js` owns both the fetch and the threshold, and now
      # writes `count` / `baseline` / `seeded` to $GITHUB_OUTPUT. It also seeds
      # the baseline itself when the file is absent, which is why the separate
      # "Seed baseline if missing" step that used to sit here is gone: it was
      # gated on `steps.drift.outputs.outcome == 'skipped'`, which is not a
      # real value (a step exposes its result as `steps.<id>.outcome`; the
      # script never wrote any output at all). It could therefore never run.
      - name: Run drift check
        id: drift
        run: node scripts/sonarcloud-drift.js

      # Ceiling on the absolute count, independent of the growth percentage.
      #
      # This is deliberately NOT `continue-on-error`. The pre-cleanup value of
      # 1,500 was chosen before the vendored/generated paths were excluded and
      # was never achievable; the fork measured 2,845 open at the baseline
      # recorded in `.sonarcloud-drift-baseline`. The ceiling below is that
      # baseline plus ~10% headroom, so it fires on real drift (a new rule
      # class, a re-enabled path, a dependency that pulls in unignored code)
      # rather than on the standing tail of upstream-identical code smells.
      #
      # Raise it deliberately, together with `--update-baseline`, when a change
      # legitimately adds issues; never to make a red run green.
      - name: Absolute-count ceiling
        run: |
          COUNT="${{ steps.drift.outputs.count }}"
          BASE="${{ steps.drift.outputs.baseline }}"
          CEILING=$(( BASE + BASE / 10 ))
          echo "Open SonarCloud issues: $COUNT (baseline $BASE, ceiling $CEILING)"
          if [ "$COUNT" -gt "$CEILING" ]; then
            echo "::error::SonarCloud open count $COUNT exceeds the ceiling of $CEILING (baseline $BASE + 10%). See MAINTENANCE.md."
            exit 1
          fi

      - name: Remind when the baseline was just seeded
        if: steps.drift.outputs.seeded == 'true'
        run: |
          echo "::warning::.sonarcloud-drift-baseline was missing and has been seeded with ${{ steps.drift.outputs.count }}. Commit it."
