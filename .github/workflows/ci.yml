# Continuous Integration for the JS/TS portions of this fork.
#
# What this runs:
#   1. Lockfile security guard (scripts/security/check-lockfiles.js).
#   2. Jest test suites in newIDE/app and GDevelop.js.
#   3. Lint + Flow type checks for newIDE/app.
#
# Karma/Mocha tests for GDJS and SharedLibs/TileMapHelper require a
# headless browser and are run in the dedicated CI jobs in
# .circleci/config.yml (kept from upstream).

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Read-only token: checkout + report test results.
permissions:
  contents: read

# Cancel superseded runs on the same branch — saves CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-guard:
    name: Lockfile security guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run guard
        run: node scripts/security/check-lockfiles.js

  test-newide-app:
    name: newIDE/app (Jest)
    runs-on: ubuntu-latest
    needs: lockfile-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: newIDE/app/package-lock.json
      - name: Install
        working-directory: newIDE/app
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Audit production dependencies
        working-directory: newIDE/app
        run: npm audit --omit=dev --audit-level=high
      - name: Test
        working-directory: newIDE/app
        env:
          CI: "true"
        run: npm test -- --watchAll=false --ci

  test-gdevelopjs:
    name: GDevelop.js (Jest)
    runs-on: ubuntu-latest
    needs: lockfile-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: GDevelop.js/package-lock.json
      - name: Install
        working-directory: GDevelop.js
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Audit production dependencies
        working-directory: GDevelop.js
        run: npm audit --omit=dev --audit-level=high
      - name: Test
        working-directory: GDevelop.js
        env:
          CI: "true"
        run: npm test

  lint-newide-app:
    name: newIDE/app (lint + format + types)
    runs-on: ubuntu-latest
    needs: lockfile-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: newIDE/app/package-lock.json
      - name: Install
        working-directory: newIDE/app
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Lint
        working-directory: newIDE/app
        run: npm run lint
      - name: Format check
        working-directory: newIDE/app
        run: npm run check-format
      - name: Flow type check
        working-directory: newIDE/app
        run: npm run flow
