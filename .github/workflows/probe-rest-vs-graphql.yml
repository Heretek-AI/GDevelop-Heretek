name: Probe - REST vs GraphQL PR creation

# THROWAWAY DIAGNOSTIC. Delete after reading the run log.
#
# Narrowing a real difference:
#   - My earlier probe used REST:  gh api -X POST /repos/{o}/{r}/pulls   -> OK (PR #141)
#   - upstream-sync uses:          gh pr create (GraphQL createPullRequest) -> FAILS
#     "pull request create failed: GraphQL: Resource not accessible by integration"
#
# So REST and GraphQL may differ. This tests BOTH in one run, each on its own
# freshly pushed branch, and prints results to STDOUT (visible in the log -
# the step summary is not readable via the API).
#
# Cleans up: closes its PRs, deletes its branches.

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  probe:
    name: REST vs GraphQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push two probe branches
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@example.com"
          for N in 1 2; do
            git checkout -q master 2>/dev/null || git checkout -q -b master
            git checkout -q -B "probe/rvrg-$N-${{ github.run_id }}" master
            echo "probe $N" > "probe-$N.txt"
            git add "probe-$N.txt"
            git commit -q -m "probe $N"
            git push -q -f origin "probe/rvrg-$N-${{ github.run_id }}"
            echo "PUSHED probe/rvrg-$N-${{ github.run_id }}"
          done

      - name: "A. REST  POST /repos/{o}/{r}/pulls"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "===== REST createPullRequest ====="
          OUT=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" \
            -f title="[probe] REST" \
            -f head="probe/rvrg-1-${{ github.run_id }}" \
            -f base=master \
            -f body="probe" 2>&1) || true
          echo "$OUT" | head -c 600
          echo ""
          echo "REST_RESULT=$(echo "$OUT" | grep -qE '"number"' && echo OK || echo FAILED)"
          NUM=$(echo "$OUT" | grep -oE '"number": *[0-9]+' | grep -oE '[0-9]+' | head -1)
          echo "REST_PR=$NUM" >> "$GITHUB_ENV"

      - name: "B. GraphQL createPullRequest (what gh pr create uses)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "===== gh pr create (GraphQL) ====="
          OUT=$(gh pr create --base master --head "probe/rvrg-2-${{ github.run_id }}" \
            --title "[probe] GraphQL" --body "probe" 2>&1) || true
          echo "$OUT" | head -c 600
          echo ""
          echo "GRAPHQL_RESULT=$(echo "$OUT" | grep -qE 'https://github.com/.*/pull/[0-9]+' && echo OK || echo FAILED)"
          NUM=$(echo "$OUT" | grep -oE '/pull/[0-9]+' | grep -oE '[0-9]+' | head -1)
          echo "GRAPHQL_PR=$NUM" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          echo "=================================="
          echo "REST_PR=$REST_PR"
          echo "GRAPHQL_PR=$GRAPHQL_PR"
          echo "=================================="

      - name: Cleanup
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for P in "$REST_PR" "$GRAPHQL_PR"; do
            [ -n "$P" ] && gh pr close "$P" --comment "probe cleanup" 2>&1 | head -2 || true
          done
          for N in 1 2; do
            git push -q origin --delete "probe/rvrg-$N-${{ github.run_id }}" 2>&1 | head -1 || true
          done
          echo "cleanup done"
