name: Probe - can GITHUB_TOKEN open a PR?

# THROWAWAY DIAGNOSTIC. Delete after reading the run summary.
#
# Settles a misdiagnosis: the token is granted `PullRequests: write` at runtime
# and `git push` with the same token succeeds, yet `gh pr create` in
# upstream-sync.yml fails with:
#   "pull request create failed: GraphQL: Resource not accessible by
#    integration (createPullRequest)"
#
# The repo's own settings say write is permitted:
#   default_workflow_permissions=write, can_approve_pull_request_reviews=true
# so "org policy forces read-only" does not explain it.
#
# This probes each capability separately to find which one actually fails:
#   1. token identity + scopes        (who is the token?)
#   2. REST createPullRequest         (same API gh uses)
#   3. gh pr create on a test branch  (the exact command that fails)
#   4. contents:write push            (control - known to work)
#
# Does NOT touch master: pushes only a probe/* branch and force-deletes it.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  probe:
    name: Probe token capabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "1. Token identity and effective permissions"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Token identity"
            echo ""
            echo "- actor: \`$GITHUB_ACTOR\`"
            echo "- repo: \`$GITHUB_REPOSITORY\`"
            echo "- event: \`$GITHUB_EVENT_NAME\`"
            echo ""
            echo "### \`GET /user\` (token's identity)"
            echo '```json'
            gh api user 2>&1 | head -40 || true
            echo '```'
            echo "### \`GET /repos/{owner}/{repo}\` permissions for this token"
            echo '```json'
            gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions' 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "2. Contents write (control - known to work)"
        run: |
          BRANCH="probe/contents-write-${{ github.run_id }}"
          git config user.name "probe-bot"
          git config user.email "probe-bot@example.com"
          git checkout -b "$BRANCH"
          date > probe-artifact.txt
          git add probe-artifact.txt
          git commit -m "probe: contents write check"
          if git push origin "$BRANCH" 2>&1; then
            echo "contents:write PUSH = OK" >> "$GITHUB_STEP_SUMMARY"
            echo "CONTENTS_WRITE=ok" >> "$GITHUB_ENV"
          else
            echo "contents:write PUSH = FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "CONTENTS_WRITE=failed" >> "$GITHUB_ENV"
          fi
          echo "PROBE_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: "3. REST createPullRequest (what gh uses underneath)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESP=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" \
            -f title="[probe] REST createPullRequest" \
            -f head="$PROBE_BRANCH" \
            -f base=master \
            -f body="Automated probe. Will be closed immediately." 2>&1)
          echo "### REST \`POST /repos/{owner}/{repo}/pulls\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP" | head -20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          PRNUM=$(echo "$RESP" | grep -oE '"number": *[0-9]+' | grep -oE '[0-9]+' | head -1)
          if [ -n "$PRNUM" ]; then
            echo "REST_PR=ok" >> "$GITHUB_ENV"
            echo "PROBE_PR=$PRNUM" >> "$GITHUB_ENV"
            echo "REST createPullRequest = OK (PR #$PRNUM)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "REST_PR=failed" >> "$GITHUB_ENV"
            echo "REST createPullRequest = FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "4. gh pr create (the exact command upstream-sync uses)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT=$(gh pr create --base master --head "$PROBE_BRANCH" \
            --title "[probe] gh pr create" \
            --body "Automated probe. Will be closed immediately." 2>&1) || true
          echo "### \`gh pr create\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$OUT" | head -10 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup - close probe PR and delete probe branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$PROBE_PR" ]; then
            gh pr close "$PROBE_PR" --comment "Probe complete; closing." || true
          fi
          git push origin --delete "$PROBE_BRANCH" || true
          echo "cleanup done" >> "$GITHUB_STEP_SUMMARY"
