# CodeQL static analysis for JS/TS.
#
# Runs on every push to master, every PR, and weekly (Monday 06:00 UTC).
# The default CodeQL config (security-and-quality) covers the rules that
# produced the 56 findings this fork is currently remediating.
#
# Findings appear under the repo's Security tab → Code scanning. Dismiss
# false positives in the GitHub UI; real bugs need an issue / PR.

name: "CodeQL"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  # CodeQL needs to read the source tree; SARIF upload needs security-events:write.
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            paths: newIDE/app/src newIDE/electron-app newIDE/web-app GDJS GDevelop.js SharedLibs Extensions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          paths: ${{ matrix.paths }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
