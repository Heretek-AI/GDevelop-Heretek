name: Upstream Sync (PR-Only)

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:

# Minimal least-privilege permissions: strictly cannot mint OIDC tokens, cannot modify packages
permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-sync-pr:
    name: Sync Upstream & Create PR
    runs-on: ubuntu-latest
    steps:
      - name: Hardened Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config user.name "heretek-sync-bot[bot]"
          git config user.email "sync-bot@heretek.ai"

      - name: Fetch Upstream
        run: |
          git remote add upstream https://github.com/4ian/GDevelop.git || true
          git fetch upstream master --tags

      - name: Check for New Upstream Commits
        id: check_diff
        run: |
          git checkout master
          UPSTREAM_COMMITS=$(git rev-list master..upstream/master --count)
          echo "Upstream commits ahead: $UPSTREAM_COMMITS"
          echo "commits_count=$UPSTREAM_COMMITS" >> $GITHUB_OUTPUT

      - name: Create Isolated Sync Branch
        if: steps.check_diff.outputs.commits_count != '0'
        id: sync_branch
        run: |
          SYNC_BRANCH="upstream-sync-$(date +%Y-%m-%d)"
          git checkout -B "$SYNC_BRANCH" master
          
          # Attempt merge
          MERGE_SUCCESS=true
          if ! git merge upstream/master -m "chore(sync): sync upstream 4ian/GDevelop changes"; then
            echo "Merge conflicts detected."
            MERGE_SUCCESS=false
          fi
          
          # SECURITY: Restore and lock local workflows to prevent upstream workflow tampering (e.g. Shai-Hulud)
          echo "Locking local .github/workflows to prevent upstream workflow tampering..."
          git checkout master -- .github/workflows
          
          # INTEGRITY CHECK: Ensure BYOK core files were not deleted or stripped
          REQUIRED_BYOK_FILES=(
            "newIDE/app/src/AI/CustomAIClient.js"
            "newIDE/app/src/AI/CustomAIClient.spec.js"
            "newIDE/app/src/AiGeneration/AiConfiguration.js"
            "newIDE/app/src/MainFrame/Preferences/PreferencesDialog.js"
            "newIDE/app/src/MainFrame/Preferences/PreferencesProvider.js"
          )
          
          for file in "${REQUIRED_BYOK_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "CRITICAL: Required BYOK file $file is missing after merge! Restoring from master..."
              git checkout master -- "$file"
            fi
          done
          
          git commit -am "chore(sync): lock workflows and verify BYOK integrity" || true
          git push origin "$SYNC_BRANCH" --force
          
          echo "sync_branch=$SYNC_BRANCH" >> $GITHUB_OUTPUT
          echo "merge_success=$MERGE_SUCCESS" >> $GITHUB_OUTPUT

      - name: Open or Update Sync PR
        if: steps.check_diff.outputs.commits_count != '0'
        run: |
          BRANCH="${{ steps.sync_branch.outputs.sync_branch }}"
          MERGE_OK="${{ steps.sync_branch.outputs.merge_success }}"
          
          PR_TITLE="[Upstream Sync] 4ian/GDevelop updates ($(date +%Y-%m-%d))"
          
          PR_BODY="### Automated Upstream Synchronization
          
          - **Upstream Source**: \`4ian/GDevelop:master\`
          - **Target**: \`Heretek-AI/GDevelop-Heretek:master\`
          - **Branch**: \`$BRANCH\`
          - **Clean Merge**: \`$MERGE_OK\`
          
          ---
          
          ### Security & Integrity Controls
          - **No Direct Push**: \`master\` is never modified automatically.
          - **Workflow Poisoning Protection**: \`.github/workflows/\` were locked to local \`master\` to prevent malicious workflow injection (Shai-Hulud vectors).
          - **BYOK File Integrity**: Core BYOK modules and test suites verified before PR creation.
          
          *Please review the diff and run tests before merging into master.*"
          
          # Check if an open PR for this branch already exists
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number -q '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for $BRANCH."
          else
            gh pr create \
              --base master \
              --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
