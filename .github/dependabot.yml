# Dependabot configuration.
#
# One `npm` ecosystem entry per package manifest in this monorepo so each
# lockfile is updated independently and PRs stay small/auditable.
#
# Grouped updates: a single "weekly-deps" PR per manifest collects all
# patch/minor updates so reviewers see one diff per package instead of N.
#
# `open-pull-requests-limit: 5` keeps the queue bounded; bump if needed.
#
# Ignored updates: stay on `^32.x` for electron to avoid native-module
# rebuild risk; remove when you're ready to bump to 33.x (see KNOWN_VULNS.md).

version: 2
updates:
  # newIDE/app — main IDE
  - package-ecosystem: "npm"
    directory: "/newIDE/app"
    schedule:
      interval: "weekly"
      day: "monday"
    # 6 PRs are already open against this directory (the 5 limit plus the
    # grouped weekly-deps PR), so new ones are suppressed at the source.
    open-pull-requests-limit: 10
    groups:
      weekly-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        # For 0.x packages a "minor" bump is breaking by semver convention.
        # Without this, the group silently carries migrations like three
        # 0.160->0.186 and react-monaco-editor 0.18->0.59 alongside real
        # patch bumps, which is how one "weekly-deps" PR turned into a
        # 19-package migration.
        exclude-patterns:
          - "three"
          - "react-monaco-editor"
          - "flow-bin"
          - "flow-coverage-report"
          - "@esotericsoftware/spine-pixi-v7"
          - "@esotericsoftware/spine-core"

  # newIDE/electron-app — desktop shell
  - package-ecosystem: "npm"
    directory: "/newIDE/electron-app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      weekly-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # newIDE/electron-app/app — main process of the desktop app
  - package-ecosystem: "npm"
    directory: "/newIDE/electron-app/app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      weekly-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # newIDE/web-app — web build of the IDE
  - package-ecosystem: "npm"
    directory: "/newIDE/web-app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      weekly-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GDJS — game engine library
  - package-ecosystem: "npm"
    directory: "/GDJS"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      weekly-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GDJS/tests — Karma/Mocha test suite for the engine
  - package-ecosystem: "npm"
    directory: "/GDJS/tests"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      weekly-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GDevelop.js — emscripten-built core
  - package-ecosystem: "npm"
    directory: "/GDevelop.js"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      weekly-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions workflows — keep action versions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      workflow-bumps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
